name: Release CI

on:
  push:
    branches: [main, next, alpha]
  pull_request:
    branches: [main, next, alpha]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags + GitHub releases
      issues: write # comment on released issues
      pull-requests: write # comment on released PRs
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # node 24 bundles npm 11.x, which trusted publishing needs (>= 11.5.1).
          # do not upgrade to npm 12 here: it defaults `allow-git` to `none` and
          # a transitive git dep in the playground (@emmetio/css-parser, via
          # @astrojs/check) then fails `npm ci` with EALLOWGIT.
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build lib
        run: npm run build
      - name: Release
        working-directory: lib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes semantic-release@25
